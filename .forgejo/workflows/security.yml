# Security gates from the factory CI.md (templates/forgejo/security.yml). One image job
# builds every Dockerfile target in one BuildKit graph (docker-bake.hcl), then gates,
# pushes and promotes each.
name: security
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
env:
  TRIVY_VERSION: 0.76.0
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  # Gate: fixable HIGH/CRITICAL findings fail the job. Reports keep every severity.
  GATE: --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned scanners
        run: |
          set -eu
          cd /tmp
          curl -fsSLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf trivy.tgz -C "$HOME/.local/bin" trivy
          tar -xzf gitleaks.tgz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          mkdir -p "$GITHUB_WORKSPACE/reports"
      - name: Secrets in history
        run: gitleaks git --redact --report-format json --report-path reports/gitleaks.json .
      - name: Record source findings and SBOM
        if: always()
        run: |
          trivy fs --scanners vuln,secret,misconfig --format json --output reports/trivy-source.json .
          trivy fs --format cyclonedx --output reports/sbom-source.cdx.json .
      - name: Gate source findings
        run: trivy fs --scanners vuln,secret,misconfig $GATE .
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: security-reports-source
          path: reports/
          if-no-files-found: warn
  image:
    # publish-isolated: one fresh runner pod per job with an empty Docker daemon, so
    # nothing a branch job leaves behind (a cache layer, a container holding the
    # Docker socket) can reach a build that is promoted on the strength of the ID
    # token below. Pull request runs use it too: one job definition.
    # scripts/check-workflow-runners.py fails CI if this changes.
    runs-on: publish-isolated
    # promote.py asks Forgejo for an Actions ID token per pushed image; it proves
    # the digest came from this workflow on main, which is what lets the
    # reference deployment's promote-merger merge the promotion without Steve.
    enable-openid-connect: true
    env:
      # Every Dockerfile target CI builds, gates and (on main) pushes. Must match
      # the default group in docker-bake.hcl (check-workflow-runners.py checks it).
      TARGETS: runtime workspace voice t3-controller glove-hub session-hub ao-workspace
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned Trivy
        run: |
          set -eu
          curl -fsSLo /tmp/trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  /tmp/trivy.tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" reports
          tar -xzf /tmp/trivy.tgz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build every target (shared stages once, the rest in parallel)
        env:
          SOURCE_REVISION: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: docker buildx bake --progress plain
      - name: Record image findings and SBOMs
        if: always()
        run: |
          for t in $TARGETS; do
            docker image inspect "candidate-$t:${GITHUB_SHA}" >/dev/null 2>&1 || continue
            mkdir -p "reports/$t"
            trivy image --format json --output "reports/$t/trivy-image.json" "candidate-$t:${GITHUB_SHA}"
            trivy image --format cyclonedx --output "reports/$t/sbom-image.cdx.json" "candidate-$t:${GITHUB_SHA}"
          done
      - name: Gate image findings
        # Every target is gated before any is pushed; one failing target fails the job
        # and nothing is promoted (the matrix let the others through).
        run: |
          failed=""
          for t in $TARGETS; do
            echo "::group::gate $t"
            trivy image $GATE "candidate-$t:${GITHUB_SHA}" || failed="$failed $t"
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "gate failed for:$failed" >&2; exit 1; fi
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        if: always()
        with:
          name: security-reports-images
          path: reports/
          if-no-files-found: warn
      # Promotion: only from main, only after the gate and the CI checks.
      # The steps come from the reference deployment so both repos promote the
      # same way: push by digest as image-publisher, then add the pin to the one
      # rolling promotion PR for this repository (promote/glovecell).
      # promote-merger there merges it when promote-guard passes; Flux applies it.
      # push-image.sh writes IMAGE=<repository>@<digest> to GITHUB_ENV, so each
      # push and its promotions are separate steps.
      - name: Fetch the promotion scripts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: |
          git -c "http.extraHeader=Authorization: token ${CI_PUBLISHER_TOKEN}" clone --quiet --depth 1 https://git.cluster.aimingupward.com/steve/opnsense-kubernetes-bgp.git /tmp/monorepo
      - name: Push the gated runtime image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-runtime:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/agent-project-controller
      - name: Open the promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component project-controller
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      - name: Open the proxy promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component project-proxy
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      - name: Open the download helper promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component download-helper
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      - name: Push the gated workspace image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-workspace:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/agent-project-workspace
      - name: Open the workspace promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component project-workspace
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      # glovecell-voice (Dockerfile target voice): promote/glovecell-voice moves
      # the pin in infra/agent-workplace/glovecell-voice/deployment.yaml.
      - name: Push the gated voice image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-voice:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/glovecell-voice
      - name: Open the voice promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component glovecell-voice
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      # T3 Connect controller (Dockerfile target t3-controller): stock T3 CLI +
      # cloudflared. Promote pin stays inert until Steve points the live
      # Deployment at it and sets T3_CONNECT_ENABLED=true (docs/clients-choice.md).
      - name: Push the gated t3-controller image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-t3-controller:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/agent-project-t3-controller
      # Off until the monorepo's .forgejo/scripts/promote.py has a
      # project-t3-controller component and a Deployment that pins it; until
      # then promote.py rejects the unknown component and main would go red.
      # Switch on with repository variable T3_CONTROLLER_PROMOTE=true.
      - name: Open the t3-controller promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.T3_CONTROLLER_PROMOTE == 'true'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component project-t3-controller
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      # glove-hub (Dockerfile target glove-hub): the in-cluster Herdr hub.
      - name: Push the gated glove-hub image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-glove-hub:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/glovecell-glove-hub
      # Off until the monorepo's .forgejo/scripts/promote.py knows the
      # glovecell-glove-hub component and its pin; until then promote.py
      # rejects it and main would go red. Switch on with repository variable
      # GLOVE_HUB_PROMOTE=true.
      - name: Open the glove-hub promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.GLOVE_HUB_PROMOTE == 'true'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component glovecell-glove-hub
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      # ao-workspace (Dockerfile target ao-workspace): Glovecell workers that
      # run Agent Orchestrator (docs/agent-orchestrator.md).
      - name: Push the gated ao-workspace image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-ao-workspace:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/glovecell-ao-workspace
      # Off until the monorepo's .forgejo/scripts/promote.py knows the
      # glovecell-ao-workspace component and its pin; until then promote.py
      # rejects it and main would go red. Switch on with repository variable
      # AO_WORKSPACE_PROMOTE=true.
      - name: Open the ao-workspace promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AO_WORKSPACE_PROMOTE == 'true'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component glovecell-ao-workspace
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
      # session-hub (Dockerfile target session-hub): AHP-ACP Gateway built from
      # its pinned commit. No cell runs it until sessionHub.enabled exists and is
      # switched on (docs/session-hub.md).
      - name: Push the gated session-hub image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CI_IMAGE_TOKEN: ${{ secrets.CI_IMAGE_TOKEN }}
        run: /tmp/monorepo/.forgejo/scripts/push-image.sh "candidate-session-hub:${GITHUB_SHA}" git.cluster.aimingupward.com/image-publisher/glovecell-session-hub
      # Off until the monorepo's .forgejo/scripts/promote.py knows the
      # glovecell-session-hub component and its pin; until then promote.py
      # rejects it and main would go red. Switch on with repository variable
      # SESSION_HUB_PROMOTE=true.
      - name: Open the session-hub promotion PR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.SESSION_HUB_PROMOTE == 'true'
        env:
          CI_PUBLISHER_TOKEN: ${{ secrets.CI_PUBLISHER_TOKEN }}
        run: >-
          python3 /tmp/monorepo/.forgejo/scripts/promote.py --component glovecell-session-hub
          --image "$IMAGE" --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA"
          --require-status "CI / checks (push)"
