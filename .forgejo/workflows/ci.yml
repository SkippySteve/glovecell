# Forgejo copy of .github/workflows/ci.yml (checks job). Image build, scan and SBOM run in
# security.yml. Forgejo ignores .github/workflows while this directory exists.
name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      # Forgejo main is mirrored to GitHub on every commit: refuse private keys,
      # tokens, private addresses and node names before anything reaches main.
      - name: Publishable (this repository is public on GitHub)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            git fetch --quiet origin "$BASE_REF"
            python3 scripts/check-publishable.py --range "origin/$BASE_REF..HEAD"
          else
            python3 scripts/check-publishable.py
          fi
      # The merge commit on main is written by Forgejo with the merging
      # account's identity, after PR checks ran. Report a personal address
      # there (the account must keep its email private); report-only until
      # main is clean, then drop continue-on-error.
      - name: Publishable merge commit (report only)
        if: github.event_name == 'push'
        continue-on-error: true
        run: python3 scripts/check-publishable.py --no-tree --last-commit
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.0.0
      - name: Install Kubernetes test API server
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.36.2 -p path)" >> "$GITHUB_ENV"
      - name: Go race tests, vet and Helm qualification
        run: |
          make test vet build
          APC_HELM_TEST=true go test -count=1 ./internal/installation
      - name: Operator and T3 denial tests
        run: |
          python3 -m venv /tmp/apc-tests
          /tmp/apc-tests/bin/pip install -r scripts/requirements-recovery.txt
          /tmp/apc-tests/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          /tmp/apc-tests/bin/python -m unittest discover -s internal/t3 -p 'test_*.py' -v
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Package release candidate
        run: make release VERSION=0.1.0-alpha.1
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: alpha-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
