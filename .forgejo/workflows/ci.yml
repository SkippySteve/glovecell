# Forgejo copy of .github/workflows/ci.yml (checks job). Image build, scan and SBOM run in
# security.yml. Forgejo ignores .github/workflows while this directory exists.
name: CI
on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  statuses: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
        with:
          version: v4.0.0
      - name: Install Kubernetes test API server
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@v0.24.1
          echo "KUBEBUILDER_ASSETS=$(setup-envtest use 1.36.2 -p path)" >> "$GITHUB_ENV"
      - name: DIAG race tests
        if: always()
        env:
          TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}/statuses
        run: |
          post() {
            curl -s -o /dev/null -X POST -H "Authorization: token $TOKEN" -H 'Content-Type: application/json' \
              -d "$(python3 -c 'import json,sys; print(json.dumps({"context":sys.argv[1],"state":"success","description":sys.argv[2][:250]}))' "$1" "$2")" "$API/$SHA"
          }
          rc=0; go test -race -count=1 ./... > /tmp/race.txt 2>&1 || rc=$?; echo "rc=$rc" >> /tmp/race.txt
          cat > /tmp/diag.py <<'PY'
          import re
          lines = open('/tmp/race.txt', errors='replace').read().splitlines()
          out = []
          i = 0
          while i < len(lines):
              l = lines[i]
              if l.startswith('WARNING: DATA RACE'):
                  frames = []
                  j = i + 1
                  while j < len(lines) and not lines[j].startswith('=====') and len(frames) < 14:
                      m = re.search(r'([\w./-]+\.go):(\d+)', lines[j])
                      if m and '/go/src/' not in lines[j] and 'runtime/' not in lines[j]:
                          frames.append(m.group(1).split('/')[-1] + ':' + m.group(2))
                      elif re.match(r'^(Write|Read|Previous|Goroutine)', lines[j]):
                          frames.append('|' + lines[j].split(' by ')[0])
                      j += 1
                  out.append('RACE ' + ' '.join(frames))
                  i = j
                  continue
              if re.match(r'^(--- FAIL|FAIL|panic:|rc=|# |\s+\S+_test\.go:\d+:|\S+\.go:\d+:\d+:|testing\.go:\d+: race)', l):
                  out.append(l.strip())
              i += 1
          seen = set()
          for o in out:
              if o not in seen:
                  seen.add(o)
                  print(o[:250])
          PY
          python3 /tmp/diag.py > /tmp/diag.txt || echo "diag-err" > /tmp/diag.txt
          i=0
          while IFS= read -r line && [ $i -lt 80 ]; do
            i=$((i+1)); post "diag-ci-$i" "$line"
          done < /tmp/diag.txt
          post diag-ci-count "lines=$i total=$(wc -l < /tmp/diag.txt)"
      - name: Go race tests, vet and Helm qualification
        run: |
          make test vet build
          APC_HELM_TEST=true go test -count=1 ./internal/installation
      - name: Operator and T3 denial tests
        run: |
          python3 -m venv /tmp/apc-tests
          /tmp/apc-tests/bin/pip install -r scripts/requirements-recovery.txt
          /tmp/apc-tests/bin/python -m unittest discover -s scripts -p 'test_*.py' -v
          /tmp/apc-tests/bin/python -m unittest discover -s internal/t3 -p 'test_*.py' -v
      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          govulncheck ./...
      - name: Package release candidate
        run: make release VERSION=0.1.0-alpha.1
      - uses: https://data.forgejo.org/forgejo/upload-artifact@16871d9e8cfcf27ff31822cac382bbb5450f1e1e # v4
        with:
          name: alpha-candidate-${{ github.sha }}
          path: dist/
          if-no-files-found: error
