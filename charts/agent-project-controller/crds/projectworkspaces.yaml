apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projectworkspaces.projects.agentwork.dev
spec:
  group: projects.agentwork.dev
  scope: Namespaced
  names:
    plural: projectworkspaces
    singular: projectworkspace
    kind: ProjectWorkspace
    shortNames: [pw]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repository
          type: string
          jsonPath: .spec.repository
        - name: Desired
          type: string
          jsonPath: .spec.desiredState
        - name: Phase
          type: string
          jsonPath: .status.phase
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [repository, desiredState]
              x-kubernetes-validations:
                - rule: self.repository == oldSelf.repository
                  message: Repository is immutable; request a new workspace.
                - rule: "(has(self.https) == has(oldSelf.https) && (!has(self.https) || self.https == oldSelf.https)) || (oldSelf.desiredState == 'Paused' && self.desiredState == 'Paused')"
                  message: Pause the workspace before editing HTTPS policy; it must stay paused during the update.
                - rule: "oldSelf.desiredState != 'Removed' || self.desiredState == 'Removed'"
                  message: Removal is terminal; request a new workspace.
                - rule: "(has(self.repositories) == has(oldSelf.repositories) && (!has(self.repositories) || self.repositories == oldSelf.repositories)) || (oldSelf.desiredState == 'Paused' && self.desiredState == 'Paused')"
                  message: Pause the workspace before enrolling repositories.
                - rule: "!has(oldSelf.repositories) || (has(self.repositories) && oldSelf.repositories.all(p, self.repositories.exists(q, p == q)))"
                  message: Repository entries are immutable; individual removal requires a verified cleanup operation.
              properties:
                repositories:
                  type: array
                  maxItems: 16
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, host, repository]
                    properties:
                      name:
                        type: string
                        maxLength: 40
                        pattern: '^[a-z][a-z0-9-]{0,39}$'
                      host:
                        type: string
                        enum: [forgejo, github]
                      repository:
                        type: string
                        maxLength: 201
                        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
                      public:
                        type: boolean
                repository:
                  type: string
                  maxLength: 201
                  pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,99}/[A-Za-z0-9][A-Za-z0-9_.-]{0,99}$'
                desiredState:
                  type: string
                  enum: [Running, Paused, Removed]
                  default: Running
                lanHosts:
                  description: Direct outbound TCP from the worker to single IPv4 hosts on the operator's LAN. Editable while running; the controller validates each address against its configured ranges.
                  type: array
                  maxItems: 8
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [address]
                  items:
                    type: object
                    required: [address, ports]
                    properties:
                      address:
                        type: string
                        maxLength: 15
                        pattern: '^((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$'
                      ports:
                        type: array
                        minItems: 1
                        maxItems: 16
                        x-kubernetes-list-type: set
                        items:
                          type: integer
                          format: int32
                          minimum: 1
                          maximum: 65535
                      note:
                        type: string
                        maxLength: 200
                      addedBy:
                        type: string
                        maxLength: 512
                      addedAt:
                        type: string
                        format: date-time
                providers:
                  description: Brokered subscription providers this project opts into. Off by default. Editable while running; removing an entry revokes that provider for this project. The controller needs a provider lease source.
                  type: array
                  maxItems: 2
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name]
                    properties:
                      name:
                        type: string
                        enum: [grok, cursor]
                      addedBy:
                        type: string
                        maxLength: 512
                      addedAt:
                        type: string
                        format: date-time
                https:
                  type: array
                  maxItems: 63
                  items:
                    type: object
                    required: [host, methods, paths]
                    properties:
                      host:
                        type: string
                        maxLength: 253
                        pattern: '^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$'
                      methods:
                        type: array
                        minItems: 1
                        maxItems: 7
                        items:
                          type: string
                          enum: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
                      paths:
                        type: array
                        minItems: 1
                        maxItems: 64
                        items:
                          type: string
                          minLength: 1
                          maxLength: 512
                          pattern: '^/'
            status:
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                audit:
                  description: 'Deprecated: no longer appended; existing entries stay readable for one release. Recent lifecycle transitions are events.k8s.io/v1 Events regarding the workspace (kubectl events --for projectworkspace/NAME); the durable history is the console History.'
                  type: array
                  maxItems: 32
                  items:
                    type: object
                    required: [time, action, generation]
                    properties:
                      time:
                        type: string
                        format: date-time
                      action:
                        type: string
                      generation:
                        type: integer
                        format: int64
