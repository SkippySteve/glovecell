apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: providerclasses.projects.agentwork.dev
spec:
  group: projects.agentwork.dev
  scope: Cluster
  names:
    plural: providerclasses
    singular: providerclass
    kind: ProviderClass
    listKind: ProviderClassList
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Driver
          type: string
          jsonPath: .spec.driver
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=="Accepted")].status
      schema:
        openAPIV3Schema:
          description: How the controller obtains short-lived access for one model provider. Cluster-scoped and admin-only; projects reference it from spec.providers[].providerClassName.
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [driver, provider]
              x-kubernetes-validations:
                - rule: self.driver == oldSelf.driver && self.provider == oldSelf.provider
                  message: driver and provider are immutable; create a new class.
              properties:
                driver:
                  description: provider-broker reads the trusted provider broker's lease Secret. openbao-broker and api-key-secret are reserved and refused until implemented. Unknown drivers fail closed.
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                provider:
                  description: The provider this class serves (grok, cursor, codex, claude). Must equal the name of each grant that references the class.
                  type: string
                  maxLength: 63
                  pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                lease:
                  type: object
                  x-kubernetes-validations:
                    - rule: "!has(self.minDuration) || (duration(self.minDuration) >= duration('1m') && duration(self.minDuration) <= duration('1h'))"
                      message: minDuration must be between 1m and 1h.
                    - rule: "!has(self.maxDuration) || (duration(self.maxDuration) > duration(has(self.minDuration) ? self.minDuration : '1m') && duration(self.maxDuration) <= duration('24h'))"
                      message: maxDuration must exceed minDuration (default 1m) and be at most 24h.
                  properties:
                    minDuration:
                      description: Remaining lifetime a lease needs before it is handed to a project. Default 1m.
                      type: string
                      maxLength: 32
                      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$'
                    maxDuration:
                      description: Cap on the expiry written into a project, counted from each reconciliation. Empty keeps the broker's expiry.
                      type: string
                      maxLength: 32
                      pattern: '^([0-9]+(\.[0-9]+)?(ns|us|ms|s|m|h))+$'
                parameters:
                  description: Driver-specific settings. Unknown keys fail closed.
                  type: object
                  maxProperties: 16
                  additionalProperties:
                    type: string
                    maxLength: 1024
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [type, status, reason, message, lastTransitionTime]
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum: ['True', 'False', Unknown]
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
