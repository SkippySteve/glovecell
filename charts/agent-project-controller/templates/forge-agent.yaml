{{- if .Values.forgeAgent.enabled }}
{{- if eq (default "forgejo" (index .Values.config "GIT_HOST" | toString)) "github" }}
{{- fail "forgeAgent.enabled applies to GIT_HOST=forgejo only" }}
{{- end }}
{{- $ns := include "apc.forgeAgentNamespace" . }}
{{- if eq $ns .Release.Namespace }}
{{- fail "forgeAgent.namespace must differ from the controller's namespace (the controller can read Secrets there)" }}
{{- end }}
# Forge agent: the only pod that mounts the Forgejo administrative token. It
# serves Discover/Grant/Revoke for workspace identities (apc-/apcp-<32 hex>)
# of FORGEJO_OWNER's repositories to the controller's ServiceAccount only,
# checked by TokenReview with its own audience. Its ServiceAccount can only
# review tokens; it has no other Kubernetes access. It runs in its own
# namespace, whose Secret the controller has no right to read.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: forge-agent
  namespace: {{ $ns }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-forge-agent-review" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: forge-agent
    namespace: {{ $ns }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: forge-agent
  namespace: {{ $ns }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: forge-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: forge-agent
    spec:
      serviceAccountName: forge-agent
      enableServiceLinks: false
{{- with .Values.controllerScheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerImagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: forge-agent
          image: {{ required "controllerImage must be a digest-pinned image" .Values.controllerImage | quote }}
          args: [forge-agent]
          env:
            - name: FORGEJO_ORIGIN
              value: {{ required "config.FORGEJO_ORIGIN is required" (index .Values.config "FORGEJO_ORIGIN") | quote }}
            - name: FORGEJO_OWNER
              value: {{ required "config.FORGEJO_OWNER is required" (index .Values.config "FORGEJO_OWNER") | quote }}
            - name: FORGEJO_TOKEN_FILE
              value: /forgejo/forgejo-token
            - name: FORGE_AGENT_CALLER
              value: {{ printf "system:serviceaccount:%s:controller" .Release.Namespace | quote }}
            - name: LISTEN_ADDR
              value: ":8443"
          ports:
            - containerPort: 8443
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml .Values.forgeAgent.resources | indent 12 }}
          volumeMounts:
            - name: forgejo-token
              mountPath: /forgejo
              readOnly: true
      volumes:
        - name: forgejo-token
          secret:
            secretName: {{ .Values.forgeAgent.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: forgejo-token
                path: forgejo-token
---
apiVersion: v1
kind: Service
metadata:
  name: forge-agent
  namespace: {{ $ns }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: forge-agent
  ports:
    - name: http
      port: 8443
      targetPort: http
---
# Only the controller's pod reaches the agent.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: forge-agent-ingress
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: forge-agent
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-project-controller
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
