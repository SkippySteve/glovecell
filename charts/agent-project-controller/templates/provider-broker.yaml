{{- if .Values.providerBroker.enabled }}
{{- $pb := .Values.providerBroker }}
{{- $ns := include "apc.providerBrokerNamespace" . }}
{{- $prefix := include "apc.policyPrefix" . }}
{{- $console := include "apc.providerConsoleSignIn" . }}
{{- $known := dict "grok" (dict "home" ".grok" "loginHosts" (list "accounts.x.ai" "auth.x.ai" "api.x.ai") "tokenHost" "auth.x.ai") "cursor" (dict "home" ".config/cursor" "loginHosts" (list "api2.cursor.sh") "tokenHost" "api2.cursor.sh") }}
{{- if ne (default "cilium" (index .Values.config "NETWORK_PROVIDER" | toString)) "cilium" }}
{{- fail "providerBroker.enabled requires NETWORK_PROVIDER=cilium (brokered providers use Cilium host policies)" }}
{{- end }}
{{- if not .Values.admissionPolicies.enabled }}
{{- fail "providerBroker.enabled requires admissionPolicies.enabled: the controller's cluster-wide Pod and RoleBinding writes could otherwise reach the provider logins" }}
{{- end }}
{{- if eq $ns .Release.Namespace }}
{{- fail "providerBroker.namespace must differ from the controller's namespace (the controller can read Secrets there)" }}
{{- end }}
{{- if not $pb.providers }}
{{- fail "providerBroker.providers must name at least one provider (grok, cursor)" }}
{{- end }}
{{- range $p := $pb.providers }}
{{- if not (hasKey $known $p) }}
{{- fail (printf "providerBroker.providers: unknown provider %q (supported: grok, cursor)" $p) }}
{{- end }}
{{- end }}
{{- if ne (len $pb.providers) (len (uniq $pb.providers)) }}
{{- fail "providerBroker.providers lists a provider twice" }}
{{- end }}
{{- if and (has "cursor" $pb.providers) (not $pb.cursorOAuthClientID) }}
{{- fail "providerBroker.cursorOAuthClientID is required when cursor is listed" }}
{{- end }}
{{- if hasKey $pb "login" }}
{{- fail "providerBroker.login was removed: sign in from the console (Connect) or with `agent-project-controller provider import`" }}
{{- end }}
{{- $controller := printf "system:serviceaccount:%s:controller" .Release.Namespace }}
{{- $broker := printf "system:serviceaccount:%s:provider-broker" $ns }}
{{- $runtimeClass := default (index .Values.config "RUNTIME_CLASS") $pb.owner.runtimeClassName }}
{{- $dnsNamespace := default "kube-system" (index .Values.config "DNS_SERVICE_NAMESPACE") }}
{{- $loginPods := list }}
{{- range $p := $pb.providers }}{{ $loginPods = append $loginPods (printf "%s-login" $p) }}{{ end }}
{{- $scheduling := fromYaml (include "apc.providerBrokerScheduling" $pb) | default dict }}
{{- /* The login pod the broker creates for console sign-in: no login volume,
       no token, emptyDir only. The admission policy below refuses any other. */}}
{{- $loginSpec := dict
  "serviceAccountName" "credential-owner"
  "automountServiceAccountToken" false
  "enableServiceLinks" false
  "restartPolicy" "Never"
  "activeDeadlineSeconds" 1200
  "securityContext" (dict "runAsNonRoot" true "runAsUser" 1000 "runAsGroup" 1000 "fsGroup" 1000 "seccompProfile" (dict "type" "RuntimeDefault"))
  "containers" (list (dict
    "name" "login"
    "image" .Values.workspaceImage
    "command" (list "python3" "-c" "import time; time.sleep(1200)")
    "env" (list (dict "name" "HOME" "value" "/owner/home") (dict "name" "NO_OPEN_BROWSER" "value" "1"))
    "securityContext" (dict "allowPrivilegeEscalation" false "readOnlyRootFilesystem" true "capabilities" (dict "drop" (list "ALL")))
    "resources" $pb.owner.resources
    "volumeMounts" (list (dict "name" "home" "mountPath" "/owner/home") (dict "name" "tmp" "mountPath" "/tmp"))))
  "volumes" (list (dict "name" "home" "emptyDir" (dict "sizeLimit" "256Mi")) (dict "name" "tmp" "emptyDir" (dict "sizeLimit" "256Mi")))
}}
{{- with $runtimeClass }}{{ $_ := set $loginSpec "runtimeClassName" . }}{{ end }}
{{- range $k, $v := $scheduling }}{{ $_ := set $loginSpec $k $v }}{{ end }}
# Subscription providers (docs/brokered-providers.md). In one namespace of
# their own:
#   owners-0         the offline credential owner: holds each listed provider's
#                    login on its own volume, runs only sleep, has no network
#                    and no service account token;
#   provider-broker  execs into owners-0 to renew each login at the provider
#                    and writes only short-lived access tokens to Secret
#                    provider-leases, which the controller copies into the
#                    projects that opted in. It also installs new logins:
#                    from the console (Connect: a short-lived <provider>-login
#                    pod with no login volume) or from an operator's
#                    `agent-project-controller provider import`.
# The controller can read provider-leases and call the broker's sign-in API,
# nothing else here; the policies at the end refuse it every write and exec in
# this namespace and keep the broker's own pods and exec to the login shapes.
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: provider-broker
  namespace: {{ $ns }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: credential-owner
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-broker
  namespace: {{ $ns }}
rules:
  # Its journal and lease Secrets, created on first use.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [provider-broker-journal, provider-leases]
    verbs: [get, patch]
  # One-shot imports from `agent-project-controller provider import`.
  - apiGroups: [""]
    resources: [secrets]
    resourceNames:
{{- range $p := $pb.providers }}
      - provider-import-{{ $p }}
{{- end }}
    verbs: [get, patch, delete]
  # Exec into the owner (renewals, installs) and the login pods.
  - apiGroups: [""]
    resources: [pods/exec]
    resourceNames: {{ if $console }}{{ prepend $loginPods "owners-0" | toJson }}{{ else }}[owners-0]{{ end }}
    verbs: [create]
{{- if $console }}
  # Console sign-in pods; their shape is enforced by admission below.
  - apiGroups: [""]
    resources: [pods]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    resourceNames: {{ toJson $loginPods }}
    verbs: [get, delete]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-broker
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: provider-broker
    namespace: {{ $ns }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-broker
---
# The controller reads the leases (PROVIDER_LEASES_SECRET), nothing else here.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: provider-leases-reader
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [provider-leases]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: provider-leases-reader
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: provider-leases-reader
{{- if $console }}
---
# The broker checks the controller's token on its sign-in API.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s-provider-broker-review" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s-provider-broker-review" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s-provider-broker-review" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: provider-broker
    namespace: {{ $ns }}
---
apiVersion: v1
kind: Service
metadata:
  name: provider-broker
  namespace: {{ $ns }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: provider-broker
  ports:
    - name: http
      port: 8443
      targetPort: http
{{- end }}
{{- range $p := $pb.providers }}
{{- if not (hasKey $pb.owner.existingClaims $p) }}
---
# The {{ $p }} login. Kept on uninstall: deleting it means signing in again.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p }}-identity
  namespace: {{ $ns }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
{{- with $pb.owner.storageClass }}
  storageClassName: {{ . | quote }}
{{- end }}
  resources:
    requests:
      storage: {{ $pb.owner.storageSize | quote }}
{{- end }}
{{- end }}
---
# Nothing in this namespace talks to anything unless a policy below allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
{{- if $console }}
---
# Only the controller reaches the broker's sign-in API.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: provider-broker-api
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: provider-broker
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Release.Namespace }}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-project-controller
      ports:
        - protocol: TCP
          port: 8443
{{- end }}
---
# The owner is offline: a deny wins over any allow.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: credential-owner-offline
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: credential-owner
  ingressDeny:
    - fromEntities: [all]
  egressDeny:
    - toEntities: [all]
---
# The broker: the API server (exec, its Secrets, login pods), DNS for the
# token endpoints, and those endpoints on 443. Ingress only from the
# controller to the sign-in API.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: provider-broker
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: provider-broker
{{- if $console }}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Release.Namespace }}
            app.kubernetes.io/name: agent-project-controller
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
{{- else }}
  ingressDeny:
    - fromEntities: [all]
{{- end }}
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $dnsNamespace }}
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
{{- range $p := $pb.providers }}
              - matchName: {{ (get $known $p).tokenHost }}
{{- end }}
    - toFQDNs:
{{- range $p := $pb.providers }}
        - matchName: {{ (get $known $p).tokenHost }}
{{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- if and (include "apc.otlpPush" .) .Values.telemetry.collector.namespace }}
    # OTLP push to the telemetry collector (telemetry.otlp, telemetry.collector).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ .Values.telemetry.collector.namespace | quote }}
{{- range $k, $v := .Values.telemetry.collector.podLabels }}
            {{ $k }}: {{ $v | quote }}
{{- end }}
      toPorts:
        - ports:
            - port: {{ include "apc.otlpPort" . | quote }}
              protocol: TCP
{{- end }}
{{- with $pb.extraEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- if $console }}
{{- range $p := $pb.providers }}
{{- $login := get $known $p }}
---
# The {{ $p }} sign-in pod (created only while a console sign-in runs)
# reaches only {{ $p }}'s sign-in hosts. No ingress.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: credential-login-{{ $p }}
  namespace: {{ $ns }}
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: credential-login
      projects.agentwork.dev/login: {{ $p }}
  ingressDeny:
    - fromEntities: [all]
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: {{ $dnsNamespace }}
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
{{- range $h := $login.loginHosts }}
              - matchName: {{ $h }}
{{- end }}
    - toFQDNs:
{{- range $h := $login.loginHosts }}
        - matchName: {{ $h }}
{{- end }}
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
{{- end }}
{{- end }}
---
# A StatefulSet so the pod keeps the fixed name owners-0 that the broker's
# exec grant and the exec policy below name.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: owners
  namespace: {{ $ns }}
spec:
  replicas: 1
  serviceName: ""
  selector:
    matchLabels:
      app.kubernetes.io/name: credential-owner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: credential-owner
    spec:
      serviceAccountName: credential-owner
      automountServiceAccountToken: false
      enableServiceLinks: false
{{- with $runtimeClass }}
      runtimeClassName: {{ . | quote }}
{{- end }}
{{- include "apc.providerBrokerScheduling" $pb | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: owner
          # The workspace image has python3 (the broker's read and write
          # helpers).
          image: {{ .Values.workspaceImage | quote }}
          command: [python3, -c, "import time; time.sleep(2147483647)"]
          env:
            - name: HOME
              value: /owner/home
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml $pb.owner.resources | indent 12 }}
          volumeMounts:
            - name: home
              mountPath: /owner/home
            - name: tmp
              mountPath: /tmp
{{- range $p := $pb.providers }}
            - name: {{ $p }}-identity
              mountPath: /owner/home/{{ (get $known $p).home }}
{{- end }}
      volumes:
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- range $p := $pb.providers }}
        - name: {{ $p }}-identity
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-identity" $p) (get $pb.owner.existingClaims $p) | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-broker
  namespace: {{ $ns }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: provider-broker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: provider-broker
    spec:
      serviceAccountName: provider-broker
      enableServiceLinks: false
{{- include "apc.providerBrokerScheduling" $pb | nindent 6 }}
{{- with .Values.controllerImagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: broker
          image: {{ .Values.controllerImage | quote }}
          args: [provider-broker]
          env:
            - name: PROVIDER_BROKER_CONTROL_NAMESPACE
              value: {{ $ns | quote }}
            - name: PROVIDER_BROKER_JOURNAL
              value: provider-broker-journal
            - name: PROVIDER_BROKER_LEASES
              value: provider-leases
            - name: PROVIDER_BROKER_PROVIDERS
              value: {{ join "," $pb.providers | quote }}
{{- range $p := $pb.providers }}
            - name: {{ upper $p }}_OWNER_NAMESPACE
              value: {{ $ns | quote }}
            - name: {{ upper $p }}_OWNER_POD
              value: owners-0
            - name: {{ upper $p }}_OWNER_CONTAINER
              value: owner
{{- end }}
{{- if has "cursor" $pb.providers }}
            # Public OAuth client ID of the Cursor CLI (not a secret).
            - name: CURSOR_OAUTH_CLIENT_ID
              value: {{ $pb.cursorOAuthClientID | quote }}
{{- end }}
{{- if $console }}
            # Console sign-in API (internal/providerbroker/server.go).
            - name: PROVIDER_BROKER_LISTEN_ADDR
              value: ":8443"
            - name: PROVIDER_BROKER_CALLER
              value: {{ $controller | quote }}
            - name: PROVIDER_LOGIN_POD
              value: {{ toJson $loginSpec | quote }}
{{- end }}
            # Traces and metrics follow the controller's (telemetry.otlp, or the
            # legacy config.OTEL_*). With telemetry.collector set the egress
            # rule above is added; otherwise allow it with providerBroker.extraEgress.
{{- include "apc.otelEnv" (dict "root" $ "optionalHeaders" true) | nindent 12 }}
{{- if $console }}
          ports:
            - name: http
              containerPort: 8443
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml $pb.resources | indent 12 }}
---
# The broker's exec reaches only owners-0 and its own login pods in this
# namespace, and it never attaches or port-forwards. Fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ printf "%s-provider-broker-exec" $prefix }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CONNECT]
        resources: [pods/exec, pods/attach, pods/portforward]
  matchConditions:
    - name: broker
      expression: {{ printf "request.userInfo.username == '%s'" $broker | quote }}
  variables:
    - name: sub
      expression: "request.?subResource.orValue('')"
  validations:
    - expression: "variables.sub == 'exec'"
      message: The provider broker never attaches to or port-forwards into pods
    - expression: {{ printf "request.namespace == '%s' && request.name in %s" $ns (toJson (ternary (prepend $loginPods "owners-0") (list "owners-0") (not (empty $console))) | replace "\"" "'") | quote }}
      message: {{ printf "The provider broker may exec only into %s/owners-0 and its login pods" $ns | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-provider-broker-exec" $prefix }}
spec:
  policyName: {{ printf "%s-provider-broker-exec" $prefix }}
  validationActions: [Deny]
{{- if $console }}
---
# The only pods the broker may create: a <provider>-login pod in its own
# namespace with the chart's login template (the workspace image, no service
# account token, emptyDir volumes only, no host access). Fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ printf "%s-provider-broker-pods" $prefix }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE]
        resources: [pods]
  matchConditions:
    - name: broker
      expression: {{ printf "request.userInfo.username == '%s'" $broker | quote }}
  variables:
    - name: spec
      expression: object.spec
    - name: provider
      expression: "has(object.metadata.labels) && 'projects.agentwork.dev/login' in object.metadata.labels ? object.metadata.labels['projects.agentwork.dev/login'] : ''"
  validations:
    - expression: "request.operation == 'CREATE'"
      message: The provider broker never changes pods
    - expression: {{ printf "request.namespace == '%s' && object.metadata.name in %s && object.metadata.name == variables.provider + '-login'" $ns (toJson $loginPods | replace "\"" "'") | quote }}
      message: The provider broker may create only its <provider>-login pods, labelled with that provider
    - expression: "object.metadata.labels['app.kubernetes.io/name'] == 'credential-login'"
      message: Login pods carry app.kubernetes.io/name=credential-login (their network policy selects it)
    - expression: "variables.spec.serviceAccountName == 'credential-owner' && has(variables.spec.automountServiceAccountToken) && variables.spec.automountServiceAccountToken == false"
      message: Login pods have no service account token
    - expression: "!has(variables.spec.hostNetwork) || !variables.spec.hostNetwork"
      message: Login pods have no host network
    - expression: "(!has(variables.spec.hostPID) || !variables.spec.hostPID) && (!has(variables.spec.hostIPC) || !variables.spec.hostIPC)"
      message: Login pods share no host namespaces
    - expression: "has(variables.spec.volumes) && variables.spec.volumes.all(v, has(v.emptyDir))"
      message: Login pods mount only emptyDir volumes, never a login volume
    - expression: {{ printf "size(variables.spec.containers) == 1 && variables.spec.containers.all(c, c.image == '%s') && (!has(variables.spec.initContainers) || size(variables.spec.initContainers) == 0) && (!has(variables.spec.ephemeralContainers) || size(variables.spec.ephemeralContainers) == 0)" .Values.workspaceImage | quote }}
      message: Login pods run one container with the chart's workspace image
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-provider-broker-pods" $prefix }}
spec:
  policyName: {{ printf "%s-provider-broker-pods" $prefix }}
  validationActions: [Deny]
{{- end }}
---
# The controller never writes, execs or changes anything in the providers'
# namespace (Pods that could mount a login, RoleBindings, the namespace
# itself). Its read of provider-leases and its calls to the sign-in API are
# unaffected. Fails closed.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ printf "%s-providers-scope" $prefix }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["*"]
        apiVersions: ["*"]
        operations: [CREATE, UPDATE, DELETE, CONNECT]
        resources: ["*/*"]
  matchConditions:
    - name: controller
      expression: {{ printf "request.userInfo.username == '%s'" $controller | quote }}
  validations:
    - expression: {{ printf "request.namespace != '%s' && !(request.resource.resource == 'namespaces' && request.name == '%s')" $ns $ns | quote }}
      message: {{ printf "The project controller may not change anything in the providers' namespace %s" $ns | quote }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ printf "%s-providers-scope" $prefix }}
spec:
  policyName: {{ printf "%s-providers-scope" $prefix }}
  validationActions: [Deny]
{{- end }}
