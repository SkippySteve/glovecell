apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
rules:
  - apiGroups: [projects.agentwork.dev]
    resources: [projectworkspaces, projectworkspaces/status, projectworkspaces/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  # No cluster-wide Secrets and no cluster-wide namespace delete: Secrets come
  # from the Role below (control namespace) and the project access ClusterRole
  # bound in each project namespace, which also lets the controller delete
  # that namespace.
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, list, watch, create]
  - apiGroups: ['']
    resources: [configmaps, persistentvolumeclaims, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch, create, update, patch, delete]
{{- if eq .Values.config.NETWORK_PROVIDER "network-policy" }}
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
{{- else }}
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
{{- if index .Values.config "LAN_GRANT_ALLOWED_CIDRS" }}
  # LAN host grants refuse every node address.
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
{{- end }}
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [ciliumnetworkpolicies.cilium.io]
    verbs: [get]
{{- end }}
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [{{ include "apc.projectAccessRole" . }}]
    verbs: [bind]
{{- if include "apc.workerExec" . }}
  # No cluster-wide exec grant: the controller binds the role below in each
  # project namespace it creates (WORKER_EXEC_CLUSTER_ROLE).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [{{ include "apc.workerExecRole" . }}]
    verbs: [bind]
---
# Exec into project workers. Bound only by RoleBindings in project namespaces.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apc.workerExecRole" . }}
rules:
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
{{- end }}
---
# A project's Secrets and its namespace object. Bound only by RoleBindings in
# project namespaces (PROJECT_ACCESS_CLUSTER_ROLE), never a ClusterRoleBinding.
# A RoleBinding in namespace apc-<uid> granting `namespaces` applies to the
# namespace object apc-<uid> itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "apc.projectAccessRole" . }}
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, create, update, patch, delete]
  - apiGroups: ['']
    resources: [namespaces]
    verbs: [get, delete]
---
# Credential ledgers in the control namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: controller-secrets
rules:
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: controller-secrets
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: controller-secrets
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-%s" .Release.Namespace .Release.Name | trunc 63 | trimSuffix "-" }}
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election
rules:
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election
subjects:
  - kind: ServiceAccount
    name: controller
---
# Workspace lifecycle Events (events.k8s.io/v1) in the control namespace,
# where every ProjectWorkspace lives: create, and patch for repeated Events
# in a series. Nothing cluster-wide and no read: Events expire, so the
# console's history does not read them (it reads the audit records).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: workspace-events
rules:
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: workspace-events
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: workspace-events
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: {{ .Release.Namespace }}
