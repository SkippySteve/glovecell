apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-project-controller
  template:
    metadata:
      annotations:
        checksum/config: {{ toJson (dict "config" .Values.config "workspaceImage" .Values.workspaceImage "proxyImage" (default .Values.controllerImage .Values.proxyImage) "workspaceScheduling" .Values.workspaceScheduling "proxyScheduling" .Values.proxyScheduling "proxyGateway" .Values.proxyGateway "t3Connect" .Values.t3Connect "database" .Values.database) | sha256sum }}
      labels:
        app.kubernetes.io/name: agent-project-controller
    spec:
      serviceAccountName: controller
      dnsPolicy: {{ .Values.controllerDNS.policy | quote }}
{{- with .Values.controllerDNS.config }}
      dnsConfig:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.nodeSelector }}
      nodeSelector:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.tolerations }}
      tolerations:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerScheduling.affinity }}
      affinity:
{{ toYaml . | indent 8 }}
{{- end }}
{{- with .Values.controllerImagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: controller
          image: {{ required "controllerImage must be a digest-pinned image" .Values.controllerImage | quote }}
          args: [controller]
          envFrom:
            - configMapRef:
                name: controller-config
          env:
{{- if .Values.additionalGitHub.enabled }}
            - name: ADDITIONAL_GITHUB_OWNER
              value: {{ required "additionalGitHub.owner is required" .Values.additionalGitHub.owner | quote }}
            - name: GITHUB_REPOSITORY_TOKEN_FILE
              value: /github-clone/token
{{- end }}
{{- if .Values.t3Connect.enabled }}
            - name: TMPDIR
              value: /tmp
{{- end }}
{{- if .Values.referenceRules.configMap }}
            - name: REFERENCE_RULES_FILE
              value: {{ printf "/reference-rules/%s" .Values.referenceRules.key | quote }}
{{- end }}
{{- $gitHost := default "forgejo" (index .Values.config "GIT_HOST" | toString) }}
{{- if not (or (eq $gitHost "forgejo") (eq $gitHost "github")) }}
{{- fail "GIT_HOST must be forgejo or github" }}
{{- end }}
{{- if eq $gitHost "github" }}
            - name: GITHUB_APP_PRIVATE_KEY_FILE
              value: /control-secrets/github-app-private-key
{{- else if .Values.forgeAgent.enabled }}
            # The Forgejo administrative token stays in the forge agent's pod
            # (forge-agent.yaml); the controller proves itself with a
            # projected token for the agent's audience.
            - name: FORGE_AGENT_URL
              value: {{ printf "http://forge-agent.%s.svc:8443" (include "apc.forgeAgentNamespace" .) | quote }}
            - name: FORGE_AGENT_TOKEN_FILE
              value: /var/run/apc/forge-agent/token
{{- else }}
            - name: FORGEJO_TOKEN_FILE
              value: /control-secrets/forgejo-token
{{- end }}
            - name: OIDC_CLIENT_SECRET_FILE
              value: /control-secrets/oidc-client-secret
{{- if and (include "apc.otlpPush" .) .Values.telemetry.otlp.headersSecret }}
            # Collector auth (telemetry.otlp.headersSecret).
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.telemetry.otlp.headersSecret | quote }}
                  key: {{ .Values.telemetry.otlp.headersKey | quote }}
{{- end }}
            # Controller database (docs/database.md): verify-full TLS.
            - name: DATABASE_URL_FILE
              value: /var/run/apc/database/uri
{{- if or (eq .Values.database.mode "cloudnativepg") .Values.database.external.caKey }}
            - name: DATABASE_CA_FILE
              value: /var/run/apc/database-ca/ca.crt
{{- end }}
            - name: DATABASE_MAX_CONNS
              value: {{ .Values.database.maxConnections | toString | quote }}
            - name: HISTORY_RETENTION
              value: {{ .Values.database.historyRetention | toString | quote }}
            - name: DECIDED_REQUEST_RETENTION
              value: {{ .Values.database.decidedRequestRetention | toString | quote }}
            - name: PROXY_SUMMARY_RETENTION
              value: {{ .Values.database.proxySummaryRetention | toString | quote }}
{{- if .Values.automationAPI.enabled }}
            - name: API_SECRET_FILE
              value: /control-secrets/api-secret
{{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: health
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
{{ toYaml .Values.controllerResources | indent 12 }}
          volumeMounts:
{{- if .Values.additionalGitHub.enabled }}
            - name: github-clone
              mountPath: /github-clone
              readOnly: true
{{- end }}
{{- if .Values.t3Connect.enabled }}
            - name: t3-account
              mountPath: /var/lib/apc/t3-connect
            - name: t3-tmp
              mountPath: /tmp
{{- end }}
            - name: control-secrets
              mountPath: /control-secrets
              readOnly: true
{{- if and .Values.forgeAgent.enabled (ne $gitHost "github") }}
            - name: forge-agent-token
              mountPath: /var/run/apc/forge-agent
              readOnly: true
{{- end }}
            - name: database
              mountPath: /var/run/apc/database
              readOnly: true
{{- if or (eq .Values.database.mode "cloudnativepg") .Values.database.external.caKey }}
            - name: database-ca
              mountPath: /var/run/apc/database-ca
              readOnly: true
{{- end }}
{{- if .Values.referenceRules.configMap }}
            - name: reference-rules
              mountPath: /reference-rules
              readOnly: true
{{- end }}
      volumes:
{{- if .Values.additionalGitHub.enabled }}
        - name: github-clone
          secret:
            secretName: {{ required "additionalGitHub.existingSecret is required" .Values.additionalGitHub.existingSecret | quote }}
            defaultMode: 0440
            items:
              - key: {{ required "additionalGitHub.tokenKey is required" .Values.additionalGitHub.tokenKey | quote }}
                path: token
{{- end }}
{{- if .Values.t3Connect.enabled }}
        - name: t3-account
          persistentVolumeClaim:
            claimName: {{ required "t3Connect.existingClaim is required when T3 Connect is enabled" .Values.t3Connect.existingClaim | quote }}
        - name: t3-tmp
          emptyDir:
            sizeLimit: 256Mi
{{- end }}
        - name: control-secrets
          secret:
            secretName: {{ .Values.existingSecret | quote }}
            defaultMode: 0440
{{- if and .Values.forgeAgent.enabled (ne $gitHost "github") }}
            # Every key but forgejo-token, which only the forge agent mounts.
            items:
              - key: oidc-client-secret
                path: oidc-client-secret
{{- if .Values.automationAPI.enabled }}
              - key: api-secret
                path: api-secret
{{- end }}
        - name: forge-agent-token
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken:
                  audience: agent-project-controller-forge-agent
                  expirationSeconds: 3600
                  path: token
{{- end }}
        # Only the URI key: the operator's app Secret also holds the password
        # and pgpass separately.
        - name: database
          secret:
            secretName: {{ include "apc.databaseSecret" . | quote }}
            defaultMode: 0440
            items:
              - key: {{ ternary .Values.database.external.uriKey "uri" (eq .Values.database.mode "external") | quote }}
                path: uri
{{- if eq .Values.database.mode "cloudnativepg" }}
        # Only ca.crt: never mount the operator's ca.key.
        - name: database-ca
          secret:
            secretName: {{ printf "%s-ca" (include "apc.databaseCluster" .) | quote }}
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
{{- else if .Values.database.external.caKey }}
        - name: database-ca
          secret:
            secretName: {{ include "apc.databaseSecret" . | quote }}
            defaultMode: 0444
            items:
              - key: {{ .Values.database.external.caKey | quote }}
                path: ca.crt
{{- end }}
{{- if .Values.referenceRules.configMap }}
        - name: reference-rules
          configMap:
            name: {{ .Values.referenceRules.configMap | quote }}
            defaultMode: 0444
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: controller
spec:
  type: ClusterIP
  # Ready includes database health; the console stays reachable while the
  # database is down so it can explain why requests are refused.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: agent-project-controller
  ports:
    - name: http
      port: 8080
      targetPort: http
