# Supply immutable image digests and deployment configuration. No credentials belong here.
controllerImage: ''
workspaceImage: ''
# Optional smaller proxy image; defaults to controllerImage in the chart.
proxyImage: ''
existingSecret: controller-secrets
# Additional private GitHub clones in the same workbench. The token is mounted
# only in the trusted controller and inspecting gateway, never in a worker.
additionalGitHub:
  enabled: false
  owner: ''
  existingSecret: ''
  tokenKey: token
automationAPI:
  enabled: false
# Forge agent (docs/security.md, "Forge agent"): a separate small pod holds the
# Forgejo administrative token and serves only workspace grants to the
# controller, so the controller holds no Forgejo admin credential. Off by
# default. Turning it on moves forgejo-token out of the controller's mounts.
forgeAgent:
  enabled: false
  # Its own namespace, so the controller (which may read every Secret in its
  # own namespace) cannot read the token. The chart creates it.
  namespace: ''
  # Secret in forgeAgent.namespace with key forgejo-token, created by the
  # operator. Then remove forgejo-token from existingSecret.
  existingSecret: forge-agent
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 64Mi
# The default AccessProfiles (locked, ask, standard, open, custom; docs/access-levels.md).
# locked is the cluster default for new cells. Set false to manage profiles yourself.
accessProfiles:
  install: true
# Longest AccessGrant per type, enforced by an admission policy from the
# grant's creation time (whole hours or minutes). Profiles may set less.
accessGrants:
  maxDuration:
    internet: 8h
    lan: 24h
    package: 720h
config:
  # network-policy is experimental and requires independent dataplane qualification.
  NETWORK_PROVIDER: cilium
  NETWORK_POLICY_ENFORCEMENT_ACKNOWLEDGED: 'false'
  NETWORK_POLICY_CLUSTER_CIDRS_JSON: ''
  # forgejo is the qualified host. github is an optional project host and is
  # not in the published 0.1.0-alpha.1 images. One controller uses one host.
  GIT_HOST: forgejo
  FORGEJO_ORIGIN: ''
  FORGEJO_OWNER: ''
  RUNTIME_CLASS: gvisor
  STORAGE_CLASS: local-path
  STORAGE_SIZE: 10Gi
  CLUSTER_DOMAIN: cluster.local
  DNS_SERVICE_NAMESPACE: kube-system
  DNS_SERVICE_NAME: kube-dns
  # false uses the CoreDNS ClusterIP. The qualified gVisor profile needs true.
  # See docs/examples/gvisor-values.yaml.
  DNS_DIRECT_ENDPOINTS: 'false'
  PROXY_GATEWAY_JSON: ''
  # Per-project LAN host grants (docs/console.md#lan-hosts). Empty turns them off.
  # Allowed: private IPv4 parents an operator may grant single hosts from.
  # Denied (required when allowed is set): node, API/service VIP, pod, service
  # and gateway ranges. Requires NETWORK_PROVIDER=cilium.
  LAN_GRANT_ALLOWED_CIDRS: ''
  LAN_GRANT_DENIED_CIDRS: ''
  # "Download into sandbox" for project sandboxes (docs/console.md#download-into-sandbox).
  # Off unless 'true'. Needs NETWORK_PROVIDER=cilium and the worker exec role.
  # Empty limit and timeout mean 2 GiB and 30m.
  DOWNLOADS_ENABLED: 'false'
  DOWNLOAD_MAX_BYTES: ''
  DOWNLOAD_TIMEOUT: ''
  # Brokered subscription providers per project (docs/brokered-providers.md).
  # <namespace>/<secret> written by the provider broker in lease mode. Empty
  # turns spec.providers off. Requires NETWORK_PROVIDER=cilium.
  PROVIDER_LEASES_SECRET: ''
  # Per-cell provider tokens: comma-separated grok and/or cursor. Workers get
  # a token unique to their cell; only the cell's proxy holds the real one.
  # Empty keeps the shared token. Set it only after every cell's proxy runs
  # an image with cell-token support (docs/brokered-providers.md).
  PROVIDER_CELL_TOKENS: ''
  WORKSPACE_CPU_REQUEST: 500m
  WORKSPACE_MEMORY_REQUEST: 512Mi
  WORKSPACE_CPU_LIMIT: '4'
  WORKSPACE_MEMORY_LIMIT: 4Gi
  PROXY_CPU_REQUEST: 100m
  PROXY_MEMORY_REQUEST: 128Mi
  PROXY_CPU_LIMIT: '1'
  PROXY_MEMORY_LIMIT: 512Mi
  # Optional trusted backend for pre-existing sandbox controls in the same app.
  SANDBOX_CONTROL_URL: ''
  SANDBOX_CONTROL_ORIGIN: ''
  SANDBOX_CONTROL_OPERATOR: ''
  PUBLIC_ORIGIN: ''
  OIDC_ISSUER: ''
  OIDC_CLIENT_ID: ''
  OIDC_GROUPS_CLAIM: groups
  OIDC_ALLOWED_GROUPS: agent-project-operators
  OIDC_SCOPES: profile,groups
  # Who may approve or deny access requests and revoke exact approvals
  # (comma-separated groups; empty means nobody). Members must also be able
  # to sign in (OIDC_ALLOWED_GROUPS). The claim defaults to OIDC_GROUPS_CLAIM.
  # The automation token and static login never approve. docs/database.md.
  OIDC_APPROVER_GROUPS: agent-project-approvers
  OIDC_APPROVER_GROUPS_CLAIM: ''
  ALLOW_STATIC_LOGIN: 'false'
  OTEL_ENABLED: 'false'
  # Publish apc-*/project host audit assignments into ConfigMap
  # glovecell-audit-assignments (inert until true). Host sync/RBAC stay off
  # until a separate one-way enable in the deployment repository (#217).
  AUDIT_ASSIGNMENT_FEED_ENABLED: 'false'
# ValidatingAdmissionPolicies (admissionregistration.k8s.io/v1, Kubernetes
# 1.30+) that refuse invalid ProjectWorkspace requests at the API server,
# with deployment settings from the admission-params ConfigMap (README
# "Admission policies"). The controller repeats every check. Disable only on
# a cluster without the API; that leaves the controller's checks alone.
admissionPolicies:
  enabled: true
# PostgreSQL holds exact approvals, access requests, history and per-request
# proxy summaries (docs/database.md). It is required.
database:
  # cloudnativepg: render a CloudNativePG Cluster (install the CloudNativePG
  # operator first). external: use an existing PostgreSQL.
  mode: cloudnativepg
  # The controller always connects with TLS (sslmode=verify-full).
  maxConnections: 10
  # How long to keep records: Go durations of at least 24h, or '0' to keep
  # them. Approvals, pending requests and the ledger actions the controller
  # relies on for safety are never pruned.
  historyRetention: 8760h
  decidedRequestRetention: 8760h
  proxySummaryRetention: 720h
  cloudnativepg:
    # Cluster name; empty means <release>-db. The operator creates the
    # Secrets <name>-app (connection URI) and <name>-ca (CA certificate).
    name: ''
    # One instance is the default; more add streaming replicas.
    instances: 1
    # Optional digest-pinned PostgreSQL image; empty uses the operator default.
    imageName: ''
    database: apc
    owner: apc
    storage:
      size: 5Gi
      # Empty uses the cluster's default StorageClass.
      storageClass: ''
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    monitoring:
      # Needs the Prometheus operator's PodMonitor CRD.
      enablePodMonitor: false
    # Where the CloudNativePG operator runs, for the database NetworkPolicy.
    operator:
      namespace: cnpg-system
      podLabels:
        app.kubernetes.io/name: cloudnative-pg
    # Further peers that may reach PostgreSQL on 5432 (NetworkPolicy peers),
    # for example a backup job.
    extraIngressFrom: []
    backup:
      enabled: false
      # plugin: the Barman Cloud plugin (install it and an ObjectStore first).
      # barmanObjectStore: CloudNativePG's in-tree Barman (deprecated upstream).
      method: plugin
      plugin:
        name: barman-cloud.cloudnative-pg.io
        # For the Barman Cloud plugin: {barmanObjectName: <ObjectStore>}.
        parameters: {}
      # spec.backup.barmanObjectStore for method barmanObjectStore
      # (destinationPath, s3Credentials, ...).
      barmanObjectStore: {}
      retentionPolicy: 30d
      # ScheduledBackup: six-field cron (seconds first).
      schedule: '0 0 3 * * *'
  external:
    # Existing Secret in the release namespace with a postgres:// URI.
    existingSecret: ''
    uriKey: uri
    # Key of the server's CA certificate in that Secret; empty trusts the
    # system roots (a publicly trusted server certificate).
    caKey: ''
controllerResources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '1'
    memory: 512Mi

# Pod placement for the trusted controller and each generated project workload.
controllerScheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
workspaceScheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
proxyScheduling:
  nodeSelector: {}
  tolerations: []
  affinity: {}
# Existing registry credentials in the control namespace, for the controller only.
# Project images must be pullable using the worker nodes' registry configuration.
controllerImagePullSecrets: []
# ClusterFirst inherits the cluster resolver. Use None with explicit dnsConfig
# only when required by the controller's own network environment.
controllerDNS:
  policy: ClusterFirst
  config: {}
# Operator control T3. Disabled until you choose a separate namespace.
# The pod is privileged so it can mount FUSE. Project sandboxes stay on gVisor.
# Set REGISTRAR_NAMESPACE from controlClient.namespace. Do not place this pod
# in the restricted control namespace.
controlClient:
  enabled: false
  namespace: agent-project-control-t3
  storageClass: ""
  storageSize: 5Gi
  servicePort: 8788
  routing:
    enabled: false
    parentRefs: []
    hostnames: []
# Optional explicit in-cluster TLS backend route for inspecting proxies.
# namespace, selector, port and disableSNIFilter match the network provider API.
# Leave empty when no backend gateway exception is needed.
proxyGateway: {}
# Expose the dashboard using an existing Gateway. No gateway is installed.
# With enabled=false the chart installs only the controller ClusterIP Service.
routing:
  enabled: false
  hostnames: []
  parentRefs: []
# Enable for a standalone rendered manifest that must create its namespace.
# Helm installations can create the namespace separately.
namespace:
  create: false
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest

# Optional reference rules (README "Reference rules"): an existing ConfigMap
# with a reference list that every project's proxy
# gets as read-only rules after its own. The controller reads it at startup,
# so give the ConfigMap a new name (for example a kustomize hash suffix) to
# roll a change out.
referenceRules:
  configMap: ''
  key: reference-rules.json

# Use the t3-controller image target when enabled. This existing PVC holds the
# stock CLI account state, outside every project namespace and storage volume.
t3Connect:
  enabled: false
  existingClaim: ''
  relayURL: https://relay.t3.codes
# Hub-and-spoke Orca (docs/hubspoke.md). Off by default. When enabled, project
# workers run orcad from orcaRuntimeImage and Ready waits for the hub process
# (`agent-project-controller hubspoke --watch`) to enroll each spoke. The hub
# Deployment below is also off until a digest-pinned hub image is set.
hubspoke:
  orca:
    enabled: false
    # Digest-pinned image that contains orcad (for example orca-pilot).
    runtimeImage: ''
    # OrchestratorClass name workspaces must set (chart default class "orca").
    className: orca
  # Hub pod that runs hubspoke --watch next to an Orca desktop CLI. Disabled
  # until image is set. Phone relay today needs the Orca desktop app (or
  # stablyai/orca#40040 for headless relay).
  hub:
    enabled: false
    image: ''
    namespace: agent-project-control-orca-hub
    # The hub's ServiceAccount in hub.namespace.
    serviceAccount: orca-hub
    # Bind the hub's pod and log read per project namespace (RoleBinding
    # orca-hub-logs to ClusterRole <release>-hub-logs) instead of granting it
    # cluster-wide. Off by default: an installation that already grants the
    # hub cluster-wide read turns this on, waits for the bindings, then
    # removes its cluster-wide grant (docs/hubspoke.md).
    logsPerProject: false
    # Hub WSS clients dial after pairing the hub itself (phone/desktop to hub).
    # Independent of config.PUBLIC_ORIGIN and of spoke.publicDomain.
    publicAddress: ''
  # Private mTLS hub-admin client for the console Hub page (APC #113/#126).
  # Empty url keeps Hub off. Deployment repo owns certs + Cilium enable pack.
  hubAdmin:
    url: ''
    # WSS origin phones dial; defaults to hub.publicAddress when empty.
    publicAddress: ''
    caFile: ''
    certFile: ''
    keyFile: ''
  # Per-project spoke dial for desktops: wss://<project>.<publicDomain>
  # (docs/hubspoke.md, APC #113 follow-up). Requires Gateway listener + DNS.
  spoke:
    publicDomain: ''
    gateway:
      name: traefik-gateway
      namespace: traefik-system
      sectionName: websecure-cluster-aimingupward
# Default OrchestratorClasses (cluster-scoped) that workspaces may name in
# spec.orchestratorClassName. All off by default. Workspaces without a class
# keep the deployment default: T3 Connect when t3Connect.enabled, else none.
# See docs/orchestrators.md.
orchestratorClasses:
  # projects.agentwork.dev/t3: T3 Connect. Requires t3Connect.enabled.
  t3:
    enabled: false
    name: t3
  # projects.agentwork.dev/orca: hub-and-spoke (docs/hubspoke.md) when
  # hubspoke.orca.enabled, else the legacy control-host registrar.
  orca:
    enabled: false
    name: orca
  # projects.agentwork.dev/command: custom command clients configured on the
  # registrar (APC_CLIENT_<KIND>_REGISTER/REVOKE).
  command:
    enabled: false
    name: command
# ProviderClass and ForgeClass (docs/classes.md). The chart generates the
# defaults from the settings above, so an upgrade changes nothing: a ForgeClass
# for the configured Forgejo (GIT_HOST=forgejo) and, when PROVIDER_LEASES_SECRET
# is set, one default ProviderClass per brokered provider. Apply the class CRDs
# from crds/ before upgrading: Helm does not upgrade CRDs.
classes:
  createDefaults: true
  # ValidatingAdmissionPolicy: ForgeClass credentials must be in this
  # namespace and only implemented drivers are admitted. Needs Kubernetes 1.30.
  # Rendered only while admissionPolicies.enabled is also true.
  admissionPolicy: true
# Optional private access to the controller through an installed Tailscale
# Kubernetes operator. This does not replace T3 account authorization.
tailscaleIngress:
  enabled: false
  hostname: ''
# glovecell-voice (docs/voice.md): Matrix voice tasks, the /v1/notify API for
# agents and the voice approval gate (docs/approval-gate.md). Off by default.
# Build the image from the Dockerfile's voice target and pin it by digest.
voice:
  enabled: false
  image: ''
  # The homeserver's https URL (the bot refuses plain http to a non-local host).
  homeserver: ''
  speech:
    # OpenAI-compatible speech API, for example a speaches Service.
    baseURL: ''
    sttModel: Systran/faster-distil-whisper-small.en
    ttsModel: speaches-ai/Kokoro-82M-v1.0-ONNX
    voice: af_heart
    language: en
    # Existing Secret with key api-key, for a cloud provider only.
    apiKeySecret: ''
  # Forgejo API origin for the gate; empty uses config.FORGEJO_ORIGIN.
  forgejoURL: ''
  orca:
    # orca-pilot handoff intake and run-record publisher (docs/voice.md).
    handoffURL: ''
    runRecordsURL: ''
  approval:
    # Enable only after asynchronous tasks and audit backups are qualified.
    enabled: false
    # OWNER/NAME or OWNER/* the gate may merge in; required for the gate.
    repos: []
    codeTTL: 24h
    maxMergesPerHour: 10
  # OWNER/NAME for task rooms without their own repository.
  defaultRepo: ''
  # Which targets each notify caller speaks for: caller=target|target,...
  notifyCallerTargets: ''
  # Existing Secrets in this namespace (the chart creates none). matrix and
  # owner are required; the others are optional and switch features on.
  #   matrix:  user_id, access_token, device_id (or password), pickle_key
  #   owner:   mxid, master_key (pinned cross-signing master key), rooms
  #   forgejo: token (the approval-gate user; used only with approval.enabled)
  #   handoff: token (the orca-pilot handoff intake bearer)
  #   notify:  one token file per caller, named after the caller
  secrets:
    matrix: glovecell-voice-matrix
    owner: glovecell-voice-owner
    forgejo: glovecell-voice-forgejo
    handoff: glovecell-voice-handoff
    notify: glovecell-voice-notify
  # Optional JSON details (docs/examples/glovecell-voice-config.json): per-room
  # targets and repositories, target aliases, the summarizer. No secrets.
  config: {}
  database:
    # shared: the controller's database (CloudNativePG or external) with
    # its own voice_* tables and mautrix's crypto_* and mx_* tables.
    # external: a separate PostgreSQL (existingSecret with uriKey/caKey).
    mode: shared
    existingSecret: ''
    uriKey: uri
    caKey: ''
    maxConnections: 5
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: '1'
      memory: 512Mi
  scheduling:
    nodeSelector: {}
    tolerations: []
    affinity: {}
  networkPolicy:
    enabled: true
    # NetworkPolicy peers allowed to call /v1/notify (8080: agent cells,
    # orchestrators) and to scrape /metrics (8081). Empty denies ingress.
    notifyFrom: []
    metricsFrom: []
    # Egress rules beyond DNS and the shared CloudNativePG database: the
    # Matrix homeserver, the speech server, Forgejo, the Orca intake (8791)
    # and run records (8790). NetworkPolicy egress rules as YAML.
    egress: []
