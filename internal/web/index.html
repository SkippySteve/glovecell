<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sandboxes</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/console.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="console-bar">
    <a class="console-brand" href="/"><span class="console-logo" aria-hidden="true"></span>Sandboxes</a>
    <span id="console-message" role="status"></span>
    <button id="console-logout" type="button" hidden>Sign out</button>
  </header>
  <main id="view" class="page" tabindex="-1"></main>
  <div id="message" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
