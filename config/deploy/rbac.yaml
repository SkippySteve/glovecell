apiVersion: v1
kind: ServiceAccount
metadata:
  name: controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-project-controller
rules:
  - apiGroups: [projects.agentwork.dev]
    resources: [projectworkspaces, projectworkspaces/status, projectworkspaces/finalizers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [namespaces, secrets, configmaps, persistentvolumeclaims, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, delete]
  - apiGroups: ['']
    resources: [persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [agents.x-k8s.io]
    resources: [sandboxes]
    verbs: [get, list, watch, create, update, patch, delete]
  # Experimental NETWORK_PROVIDER=network-policy. Default cilium does not use
  # these rules; remove them when that profile is not installed.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [nodes]
    verbs: [get, list]
  - apiGroups: [cilium.io]
    resources: [ciliumnetworkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [ciliumnetworkpolicies.cilium.io]
    verbs: [get]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
  # No cluster-wide exec grant: the controller binds the role below in each
  # project namespace it creates (WORKER_EXEC_CLUSTER_ROLE).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [agent-project-controller-worker-exec]
    verbs: [bind]
---
# Exec into project workers (T3 Connect, registrar). Bound only by
# RoleBindings in project namespaces, never a ClusterRoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-project-controller-worker-exec
rules:
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-project-controller
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-project-controller
subjects:
  - kind: ServiceAccount
    name: controller
    namespace: agent-project-controller
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: leader-election
rules:
  - apiGroups: ['']
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: leader-election
subjects:
  - kind: ServiceAccount
    name: controller
